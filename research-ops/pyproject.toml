[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-ops"
version = "0.1.0"
description = "Branching research execution control plane for Codex workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<5",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
team = [
  "argon2-cffi>=23.1,<26",
  "py-landlock>=0.1.1,<0.2; sys_platform == 'linux'",
]
dev = [
  "duckdb>=1.4,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]
swe-runtime = [
  "docker>=7.1,<8",
  "requests>=2.32,<3",
  "unidiff>=0.7,<1",
]
ppt-runtime = [
  "docker>=7.1,<8",
]
ppt-k8s = [
  "kubernetes>=31,<37",
]

[project.scripts]
rops = "research_ops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/research_ops"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
