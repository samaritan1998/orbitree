; Template only. Replace release, origin and account names before installation.
; Keep this configuration and all control logs root-owned and private.
[program:research-ops-team-gateway]
command=/opt/research-ops-team/releases/v1/.venv/bin/python -m research_ops.team.server --root /srv/research-ops-team --frontend /opt/research-ops-team/releases/v1/web/dist --release /opt/research-ops-team/releases/v1 --origin https://research.example.com --host 127.0.0.1 --port 8030
directory=/opt/research-ops-team/releases/v1
environment=PYTHONPATH="/opt/research-ops-team/releases/v1/backend"
user=root
autostart=true
autorestart=unexpected
startretries=3
stopsignal=TERM
stdout_logfile=/srv/research-ops-team/control/gateway.log
redirect_stderr=true

[program:research-ops-alice]
command=/opt/research-ops-team/releases/v1/.venv/bin/python -m research_ops.team.launch /srv/research-ops-team/control/alice.json
directory=/opt/research-ops-team/releases/v1
environment=PYTHONPATH="/opt/research-ops-team/releases/v1/backend"
; The launcher drops to rops_alice before executing the worker or any Agent.
user=root
autostart=true
autorestart=unexpected
startretries=3
stopsignal=TERM
stdout_logfile=/srv/research-ops-team/control/alice.log
redirect_stderr=true
