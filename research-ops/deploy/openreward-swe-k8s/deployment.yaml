apiVersion: v1
kind: ServiceAccount
metadata:
  name: openreward-swe-runtime
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-swe-runtime
    app.kubernetes.io/part-of: research-ops
    research-ops.work-id: harn-0001
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openreward-swe-runtime
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-swe-runtime
    app.kubernetes.io/part-of: research-ops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openreward-swe-runtime
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-swe-runtime
    app.kubernetes.io/part-of: research-ops
subjects:
  - kind: ServiceAccount
    name: openreward-swe-runtime
    namespace: @@NAMESPACE@@
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openreward-swe-runtime
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openreward-swe-runtime
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-swe-runtime
    app.kubernetes.io/part-of: research-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openreward-swe-runtime
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: @@NAMESPACE@@
      ports:
        - protocol: TCP
          port: 9101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openreward-swe-runtime
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-swe-runtime
    app.kubernetes.io/part-of: research-ops
    research-ops.work-id: harn-0001
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openreward-swe-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openreward-swe-runtime
        app.kubernetes.io/part-of: research-ops
        research-ops.work-id: harn-0001
      annotations:
        research-ops.code-sha256: @@CODE_SHA256@@
    spec:
      serviceAccountName: openreward-swe-runtime
      automountServiceAccountToken: true
      enableServiceLinks: false
      imagePullSecrets:
        - name: @@IMAGE_PULL_SECRET@@
      terminationGracePeriodSeconds: 30
      containers:
        - name: runtime
          image: @@IMAGE@@
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/research-ops/scripts/run_openreward_swe_runtime.py"]
          args: ["--host", "0.0.0.0", "--port", "9101"]
          env:
            - name: PYTHONPATH
              value: /opt/research-ops/backend
            - name: ORS_SWE_ENGINE
              value: kubernetes
            - name: ORS_SWE_REQUIRE_AUTH
              value: "true"
            - name: ORS_SWE_SANDBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: @@AUTH_SECRET@@
                  key: runtime_token
            - name: ORS_SWE_K8S_NAMESPACE
              value: @@NAMESPACE@@
            - name: ORS_SWE_K8S_HOST_ROOT
              value: @@HOST_ROOT@@
            - name: ORS_SWE_K8S_WORK_ROOT
              value: @@WORK_ROOT@@
            - name: ORS_SWE_K8S_IMAGE_PULL_SECRET
              value: @@IMAGE_PULL_SECRET@@
            - name: ORS_SWE_K8S_IMAGE_PREFIX
              value: @@IMAGE_PREFIX@@
            - name: ORS_SWE_K8S_SWEGYM_IMAGE_PREFIX
              value: @@SWEGYM_IMAGE_PREFIX@@
            - name: ORS_SWE_K8S_IMAGE_MAP_PATH
              value: @@IMAGE_MAP_PATH@@
            - name: ORS_SWE_HARNESS_FAMILY
              value: @@HARNESS_FAMILY@@
            - name: ORS_SWE_HARNESS_ROOT
              value: /opt/swebench
            - name: ORS_SWE_HARNESS_REVISION
              value: @@HARNESS_REVISION@@
            - name: ORS_SWE_PULL_MISSING_IMAGES
              value: "false"
            - name: ORS_SWE_SESSION_TTL_SECONDS
              value: "3600"
            - name: ORS_SWE_VERIFY_SECONDS
              value: "1800"
            - name: ORS_SWE_COMMAND_SECONDS
              value: "120"
            - name: ORS_SWE_K8S_POD_START_SECONDS
              value: "900"
            - name: ORS_SWE_K8S_DELETE_SECONDS
              value: "180"
          ports:
            - name: http
              containerPort: 9101
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: research-ops-code
              mountPath: /opt/research-ops
              readOnly: true
            - name: swe-harness
              mountPath: /opt/swebench
              readOnly: true
            - name: swe-work
              mountPath: @@WORK_ROOT@@
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: research-ops-code
          hostPath:
            path: @@RESEARCH_OPS_ROOT@@
            type: Directory
        - name: swe-harness
          hostPath:
            path: @@HARNESS_HOST_ROOT@@
            type: Directory
        - name: swe-work
          hostPath:
            path: @@WORK_ROOT@@
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openreward-swe-runtime
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-swe-runtime
    app.kubernetes.io/part-of: research-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openreward-swe-runtime
  ports:
    - name: http
      port: 9101
      targetPort: http
      protocol: TCP
