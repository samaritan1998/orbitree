apiVersion: batch/v1
kind: Job
metadata:
  generateName: openreward-ppt-runtime-control-
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-ppt-runtime-control
    app.kubernetes.io/part-of: research-ops
    research-ops.work-id: harn-0001
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openreward-ppt-runtime-control
        app.kubernetes.io/part-of: research-ops
        research-ops.work-id: harn-0001
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: @@IMAGE_PULL_SECRET@@
      containers:
        - name: control
          image: @@PPT_IMAGE@@
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |-
              set -euo pipefail
              evidence_root=@@ARTIFACT_ROOT@@/control
              mkdir -p "${evidence_root}"
              exec python3 /opt/research-ops/scripts/run_openreward_ppt_k8s_control.py \
                --runtime-url http://openreward-ppt-runtime:9103 \
                --bundle-root @@BUNDLE_ROOT@@ \
                --artifact-root @@ARTIFACT_ROOT@@ \
                --task-id @@TASK_ID@@ \
                --timeout-seconds 7000 \
                --output "${evidence_root}/${HOSTNAME}.json"
          workingDir: /opt/research-ops
          env:
            - name: PYTHONPATH
              value: /opt/research-ops/backend
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ORS_PPT_RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: @@AUTH_SECRET@@
                  key: runtime_token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: research-ops-code
              mountPath: /opt/research-ops
              readOnly: true
            - name: task-bundles
              mountPath: @@BUNDLE_ROOT@@
              readOnly: true
            - name: artifact-root
              mountPath: @@ARTIFACT_ROOT@@
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: research-ops-code
          hostPath:
            path: @@RESEARCH_OPS_ROOT@@
            type: Directory
        - name: task-bundles
          hostPath:
            path: @@BUNDLE_ROOT@@
            type: Directory
        - name: artifact-root
          hostPath:
            path: @@ARTIFACT_ROOT@@
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
