apiVersion: batch/v1
kind: Job
metadata:
  generateName: openreward-ppt-reward-parity-
  namespace: @@NAMESPACE@@
  labels:
    app.kubernetes.io/name: openreward-ppt-reward-parity
    app.kubernetes.io/part-of: research-ops
    research-ops.work-id: harn-0001
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openreward-ppt-reward-parity
        app.kubernetes.io/part-of: research-ops
        research-ops.work-id: harn-0001
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: @@IMAGE_PULL_SECRET@@
      containers:
        - name: parity
          image: @@PPT_IMAGE@@
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |-
              set -euo pipefail
              evidence_root=@@ARTIFACT_ROOT@@/parity
              mkdir -p "${evidence_root}"
              exec python3 /opt/research-ops/scripts/run_slideforge_reward_http_parity.py \
                --adapter-url http://openreward-ppt-reward:9104 \
                --catalog /opt/research-ops/config/openreward-ppt-canary.json \
                --bundle-root @@BUNDLE_ROOT@@ \
                --artifact-root @@ARTIFACT_ROOT@@ \
                --timeout-seconds 7000 \
                --output "${evidence_root}/${HOSTNAME}.json"
          workingDir: /opt/research-ops
          env:
            - name: PYTHONPATH
              value: /opt/research-ops/backend
            - name: ORS_PPT_RUBRIC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: @@AUTH_SECRET@@
                  key: rubric_token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: research-ops-code
              mountPath: /opt/research-ops
              readOnly: true
            - name: task-bundles
              mountPath: @@BUNDLE_ROOT@@
              readOnly: true
            - name: artifact-root
              mountPath: @@ARTIFACT_ROOT@@
      volumes:
        - name: research-ops-code
          hostPath:
            path: @@RESEARCH_OPS_ROOT@@
            type: Directory
        - name: task-bundles
          hostPath:
            path: @@BUNDLE_ROOT@@
            type: Directory
        - name: artifact-root
          hostPath:
            path: @@ARTIFACT_ROOT@@
            type: DirectoryOrCreate
